[build]
  command = "pnpm --filter @mirusync/web build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[dev]
  command = "pnpm --filter @mirusync/web dev"
  targetPort = 5173
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
